name: Automatically submit independently reviewed AnyPS5 batches

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: anyps5-reviewed-queue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'xdCloudy/PS5-13.60-Function-Stub-Library'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify trusted queue selector
        run: python -m unittest discover -s tests -p 'test_anyps5_auto_queue.py' -v
      - name: Select an explicitly approved, never-submitted batch
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python tools/anyps5_auto_queue.py --github-output "$GITHUB_OUTPUT"
      - name: Dispatch the pinned preparation, build and final publish gates
        if: steps.select.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.select.outputs.evidence_path }}
          EVIDENCE_SHA: ${{ steps.select.outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EVIDENCE_PATH" =~ ^approvals/anyps5/[A-Za-z0-9][A-Za-z0-9_.-]{0,110}\.jsonl$ ]] || exit 1
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          url="https://raw.githubusercontent.com/xdCloudy/PS5-13.60-Function-Stub-Library/$source_sha/$EVIDENCE_PATH"
          gh workflow run anyps5-stub-submit.yml \
            --repo xdCloudy/PS5-13.60-Function-Stub-Library --ref main \
            --field evidence_url="$url" \
            --field evidence_sha256="$EVIDENCE_SHA" \
            --field max_stubs=100 \
            --field publish=true
          echo "Dispatched independently approved batch $EVIDENCE_PATH ($EVIDENCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Report empty verified queue
        if: steps.select.outputs.ready != 'true'
        run: |
          echo "No approved eligible unpublished ABI batches; no upstream PR attempted." >> "$GITHUB_STEP_SUMMARY"
          echo "The catalogue and 3.20 source names alone do not establish ABI or constant-return behaviour." >> "$GITHUB_STEP_SUMMARY"
