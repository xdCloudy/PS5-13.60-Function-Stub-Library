name: Refresh PS5 readiness and AnyPS5 coverage

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'reports/progress.json'
      - 'reports/library-progress.md'
      - 'reports/upstream-review-queue.jsonl'
      - 'reports/upstream-source-candidates.jsonl'
      - 'reports/open-pr-cache.json'
      - 'reports/anyps5-evidence.jsonl'
  pull_request:
    branches: [main]
  schedule:
    # A separate repository needs dispatch/webhook for instant cross-repo pushes.
    - cron: '17 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [anyps5-updated]

concurrency:
  group: ps5-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify and refresh canonical manifest checksums
        run: python tools/refresh_manifest.py
      - name: Clone upstream main (read-only)
        run: git clone --quiet --depth 1 --filter=blob:none https://github.com/boykopovar/AnyPS5.git ../AnyPS5
      - name: Verify layout-aware patch planning against real AnyPS5 libraries
        run: python tools/live_layout_probe.py --upstream-dir ../AnyPS5
      - name: Discover exact existing throwing signatures for separate behaviour review
        run: |
          python tools/discover_anyps5_constant_candidates.py \
            --upstream-dir ../AnyPS5 \
            --output reports/anyps5-constant-candidates.jsonl
      - name: Publish read-only constant candidate review queue artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anyps5-existing-constant-review-candidates
          path: reports/anyps5-constant-candidates.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Clone PS5 3.20 public forwarding sources (read-only)
        run: git clone --quiet --depth 1 https://github.com/DNNDHH/PS5-3.20_Libs.git ../PS5-3.20_Libs
      - name: Rebuild report and collect upstream NID observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            python tools/update_progress.py --upstream-dir ../AnyPS5
          else
            python tools/update_progress.py --upstream-dir ../AnyPS5 --skip-prs
          fi
      - name: Derive AnyPS5 declaration and source-body states
        run: python tools/anyps5_metadata.py --upstream-dir ../AnyPS5
      - name: Reconcile 3.20 registrations (metadata only)
        run: python tools/ingest_320.py --source-dir ../PS5-3.20_Libs
      - name: Regenerate coverage matrices and dashboard feed
        run: python tools/build_coverage.py
      - name: Validate generated reports and dashboard consistency
        run: python tools/validate_pipeline.py
      - name: Publish workflow summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("reports/progress.json"))
          i=d["inventory"]; s=d["stubs"]
          print("## PS5 readiness")
          print(f"- Strictly reverified names: {i['strictly_reverified_named_records']:,} / {i['records']:,}")
          print(f"- Qualified unique NIDs: {s['qualified_unique_nids_recomputed']:,}")
          print(f"- AnyPS5 main definition matches: {s['qualified_unique_nids_matched_in_main_source']:,}")
          print(f"- Open-PR patch matches: {s['qualified_unique_nids_matched_in_open_pr_additions']:,}")
          print(f"- Open PR heads indexed: {d['generated_from']['anyps5_open_prs']['open_pr_scanned']:,} / {d['generated_from']['anyps5_open_prs']['open_pr_total']:,}")
          print(f"- Public source-name proposals staged: {s['auto_imported_public_source_name_proposals']:,}")
          print(f"- Open PR scan complete: {d['generated_from']['anyps5_open_prs']['open_pr_coverage_complete']}")
          print("- Source matches do not guarantee export registration or runtime validation.")
          PY
      - name: Commit generated reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json READINESS.md reports/progress.json reports/library-progress.md reports/upstream-review-queue.jsonl reports/upstream-source-candidates.jsonl reports/open-pr-cache.json reports/anyps5-evidence.jsonl reports/source-320.json reports/source-320-review.jsonl reports/coverage-matrices.json reports/coverage-matrices.md reports/coverage-history.json reports/anyps5-symbol-states.json reports/anyps5-symbol-states.jsonl reports/anyps5-symbol-changes.json site/data.json
          if git diff --cached --quiet; then
            echo "Progress files are current."
            exit 0
          fi
          git commit -m "docs: refresh readiness and AnyPS5 observations [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify and refresh canonical manifest checksums
        run: python tools/refresh_manifest.py
      - name: Clone upstream main (read-only)
        run: git clone --quiet --depth 1 --filter=blob:none https://github.com/boykopovar/AnyPS5.git ../AnyPS5
      - name: Verify layout-aware patch planning against real AnyPS5 libraries
        run: python tools/live_layout_probe.py --upstream-dir ../AnyPS5
      - name: Enumerate unapproved constant-function review candidates
        run: |
          python tools/discover_anyps5_constant_candidates.py \
            --upstream-dir ../AnyPS5 \
            --output reports/anyps5-constant-candidates.jsonl
      - name: Clone PS5 3.20 sources (read-only)
        run: git clone --quiet --depth 1 https://github.com/DNNDHH/PS5-3.20_Libs.git ../PS5-3.20_Libs
      - name: Generate a PR preview (never pushes PR code)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/update_progress.py --upstream-dir ../AnyPS5 --skip-prs
          python tools/anyps5_metadata.py --upstream-dir ../AnyPS5
          python tools/ingest_320.py --source-dir ../PS5-3.20_Libs
          python tools/build_coverage.py
          python tools/validate_pipeline.py
          python tools/stage_catalogue_import.py --output reports/catalogue-import-proposal.json
      - name: Upload report preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ps5-readiness-preview
          path: |
            READINESS.md
            reports/progress.json
            reports/library-progress.md
            reports/upstream-review-queue.jsonl
            reports/upstream-source-candidates.jsonl
            reports/anyps5-evidence.jsonl
            reports/source-320.json
            reports/source-320-review.jsonl
            reports/coverage-matrices.json
            reports/coverage-matrices.md
            reports/coverage-history.json
            reports/catalogue-import-proposal.json
            reports/anyps5-symbol-states.json
            reports/anyps5-symbol-states.jsonl
            reports/anyps5-symbol-changes.json
            reports/anyps5-constant-candidates.jsonl
            site/index.html
            site/data.json
          retention-days: 14
