name: AnyPS5 checked 13.60 Remoteplay throwing exports

on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_anyps5_remoteplay_1360.py'
      - 'tests/test_anyps5_remoteplay_1360.py'
      - '.github/workflows/anyps5-remoteplay-1360.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anyps5-remoteplay-pending
  cancel-in-progress: false

jobs:
  verify-and-submit:
    if: github.repository == 'xdCloudy/PS5-13.60-Function-Stub-Library'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check generator regression tests
        run: |
          python -m unittest discover -s tests -p 'test_anyps5_remoteplay_1360.py' -v
          python -m unittest discover -s tests -p 'test_dual_firmware_review.py' -v
      - name: Clone current AnyPS5
        run: git clone --quiet https://github.com/boykopovar/AnyPS5.git "$RUNNER_TEMP/AnyPS5"
      - name: Generate and locally inspect candidate batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/AnyPS5"
          upstream_sha="$(git rev-parse HEAD)"
          short_sha="$(printf '%s' "$upstream_sha" | cut -c1-12)"
          branch="feat/remoteplay-remoteplay-1360-$short_sha"
          echo "ANYPS5_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "ANYPS5_HEAD=$upstream_sha" >> "$GITHUB_ENV"
          git switch -c "$branch"
          mkdir -p "$RUNNER_TEMP/remoteplay-batch"
          cd "$GITHUB_WORKSPACE"
          python tools/prepare_anyps5_remoteplay_1360.py \
            --catalogue "$GITHUB_WORKSPACE" \
            --upstream "$RUNNER_TEMP/AnyPS5" \
            --report "$RUNNER_TEMP/remoteplay-batch/evidence.json" --apply
          cd "$RUNNER_TEMP/AnyPS5"
          git add core/libs/prx/libSceRemoteplay/Export.cpp \
            core/libs/prx/libSceRemoteplay/include/InventoryExports.hpp \
            docs/dev/debt/libSceRemoteplay.md
          git diff --cached --check
          git -c user.name=xdCloudy -c user.email=52116030+xdCloudy@users.noreply.github.com \
            commit -m "feat(libSceRemoteplay): declare PS5 13.60 Remoteplay pending exports"
          python tools/check_conventions.py --base origin/main
          python core/libs/tests/test_public_headers.py --audit-only
          scan="$(python tools/pr_overlap.py --branch "$branch" --repo boykopovar/AnyPS5)"
          [[ "$scan" == "No overlap with open pull requests." ]] || {
            echo "::error::Official upstream open PR overlap scan failed or detected overlap"
            printf '%s\n' "$scan"
            exit 1
          }
          git diff --binary origin/main..HEAD > "$RUNNER_TEMP/remoteplay-batch/anyps5.patch"
      - name: Full Linux build and tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ninja-build build-essential cmake libx11-dev libxext-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev
          cd "$RUNNER_TEMP/AnyPS5"
          git submodule update --init --recursive
          cmake -S . -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/build" --target libSceRemoteplay --parallel 2
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/build" --parallel 2 --output-on-failure
      - name: Upload evidence and patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remoteplay-remoteplay-1360-candidate-batch
          path: |
            ${{ runner.temp }}/remoteplay-batch/evidence.json
            ${{ runner.temp }}/remoteplay-batch/anyps5.patch
          retention-days: 90
          if-no-files-found: warn
      - name: Recheck overlap and create draft AnyPS5 PR as xdCloudy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ANYPS5_SUBMIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::ANYPS5_SUBMIT_TOKEN missing"; exit 1; }
          [[ "$(gh api user --jq .login)" == "xdCloudy" ]] || {
            echo "::error::Submission token does not belong to xdCloudy"
            exit 1
          }
          cd "$RUNNER_TEMP/AnyPS5"
          # A complete AnyPS5 build takes long enough for upstream to move.
          # Never publish the stale build. Rebase, revalidate, rebuild and
          # rerun the official live overlap scanner, capped to three attempts.
          git config user.name "xdCloudy"
          git config user.email "52116030+xdCloudy@users.noreply.github.com"
          validated_main=""
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            newest_main="$(git rev-parse origin/main)"
            built_main="$(git rev-parse HEAD^)"
            if [[ "$newest_main" != "$built_main" ]]; then
              echo "Upstream advanced to $newest_main; rebasing attempt $attempt"
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Upstream rebase conflicts with this batch; stop for review"
                exit 1
              fi
              # Validate against the NEW BASE, not the generated batch itself:
              # this rejects a name/NID already introduced while we built.
              base_check="$RUNNER_TEMP/base-check"
              git worktree add --quiet --detach "$base_check" origin/main
              cd "$GITHUB_WORKSPACE"
              python tools/prepare_anyps5_remoteplay_1360.py \
                --catalogue "$GITHUB_WORKSPACE" \
                --upstream "$base_check" \
                --report "$RUNNER_TEMP/remoteplay-batch/base-recheck.json"
              cd "$RUNNER_TEMP/AnyPS5"
              git worktree remove --force "$base_check"
              git diff --check origin/main...HEAD
              python tools/check_conventions.py --base origin/main
              python core/libs/tests/test_public_headers.py --audit-only
              cmake -S . -B "$RUNNER_TEMP/build" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
              cmake --build "$RUNNER_TEMP/build" --target libSceRemoteplay --parallel 2
              cmake --build "$RUNNER_TEMP/build" --parallel 2
              ctest --test-dir "$RUNNER_TEMP/build" --parallel 2 --output-on-failure
            fi
            scan="$(python tools/pr_overlap.py --branch "$ANYPS5_BRANCH" --repo boykopovar/AnyPS5)"
            [[ "$scan" == "No overlap with open pull requests." ]] || {
              echo "::error::Official live upstream PR overlap failed or is incomplete"
              printf '%s\n' "$scan"
              exit 1
            }
            live="$(git ls-remote https://github.com/boykopovar/AnyPS5.git refs/heads/main | cut -f1)"
            if [[ "$live" == "$(git rev-parse HEAD^)" ]]; then
              validated_main="$live"
              break
            fi
            echo "Upstream moved during verification; attempt $attempt of 3"
          done
          [[ -n "$validated_main" ]] || {
            echo "::error::Upstream moved too often; no stale PR will be published"
            exit 1
          }
          echo "Validated AnyPS5 main: $validated_main" >> "$GITHUB_STEP_SUMMARY"
          git diff --binary origin/main..HEAD > "$RUNNER_TEMP/remoteplay-batch/anyps5-validated.patch"
          gh auth setup-git
          git remote add contributor https://github.com/xdCloudy/AnyPS5.git
          if [[ -n "$(git ls-remote --heads contributor "$ANYPS5_BRANCH")" ]]; then
            echo "Identical contributor branch already exists, avoiding duplicates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --force-with-lease="refs/heads/$ANYPS5_BRANCH:" contributor \
            "HEAD:refs/heads/$ANYPS5_BRANCH"
          cat > "$RUNNER_TEMP/remoteplay-batch/body.md" <<'BODY'
          ## What

          Adds the confirmed PS5 13.60 sceRemoteplayGetClientInfo export
          declaration as always-throwing NotImplemented_nid_no_patch
          placeholders. They do not return 0 or invent functional behaviour.

          These parameterless int declarations are provisional for import
          resolution only, as accepted in merged PRs #10068, #9990 and #9695.
          Exact guest prototypes and runtime behaviour remain unverified.

          ## Validation

          - NID independently rehashed and matched to 13.60 export records
          - All upstream PRX providers checked for existing exports
          - Official open-PR overlap tool run against live PRs
          - Header and conventions checks passed
          - Linux libSceRemoteplay build and CTest passed
          - Console runtime and guest ABI not measured

          ## Checklist

          - Depends on: none
          - Fixes: none
          - Unblocks: none
          - AI-assisted: yes
          - Technical debt records provisional signatures and NIDs
          BODY
          if ! gh pr create --repo boykopovar/AnyPS5 --base main \
            --head "xdCloudy:$ANYPS5_BRANCH" --draft \
            --title "feat(libSceRemoteplay): declare 13.60 client-info throwing export" \
            --body-file "$RUNNER_TEMP/remoteplay-batch/body.md"; then
            git push contributor ":refs/heads/$ANYPS5_BRANCH" || true
            echo "::error::Upstream draft PR creation failed; cleanup attempted"
            exit 1
          fi
