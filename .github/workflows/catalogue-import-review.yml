name: Stage reviewed catalogue import proposals

on:
  workflow_run:
    workflows: ["Refresh PS5 readiness and AnyPS5 coverage"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-import-proposals
  cancel-in-progress: false

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'repository_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate trusted catalogue scripts
        run: python -m unittest discover -s tests -v
      - name: Stage public import candidates (no canonical mutation)
        run: python tools/stage_catalogue_import.py --output "$RUNNER_TEMP/catalogue-proposal.json"
      - name: Publish a deduplicated draft review PR when needed
        shell: bash
        env:
          GH_TOKEN: ${ github.token }
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/catalogue-proposal.json"
          if [[ ! -s "$proposal" ]]; then
            echo "No new reviewable identities; no PR required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["reviewable_identity_count"])' "$proposal")"
          fingerprint="$(python tools/review_proposal_identity.py fingerprint "$proposal")"
          base_branch="automation/catalogue-review"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep exactly one live review PR, updating evidence when source SHAs move.
          open_heads="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 250 \
            --json headRefName --jq '[.[].headRefName | select(startswith("automation/catalogue-review"))] | unique | .[]')"
          if [[ "$open_heads" == *$'\n'* ]]; then
            echo "::error::Multiple catalogue-review PRs are open; refuse to publish a duplicate."
            exit 1
          fi
          create_pr=true
          if [[ -n "$open_heads" ]]; then
            branch="$open_heads"
            create_pr=false
          else
            branch="$base_branch"
            # A prior *closed* review must never silently reopen merely because
            # a source SHA or report timestamp moved.
            prior="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$base_branch" \
              --state closed --limit 100 --json number --jq '.[0].number // empty')"
            if [[ -n "$prior" ]]; then
              if ! git fetch --quiet --no-tags origin "refs/pull/${prior}/head"; then
                echo "::error::Cannot inspect the closed review's exact proposal."
                exit 1
              fi
              if ! git show "FETCH_HEAD:reports/catalogue-import-proposal.json" > "$RUNNER_TEMP/closed-catalogue-proposal.json"; then
                echo "::error::Closed review has no inspectable proposal; require reconciliation."
                exit 1
              fi
              set +e
              python tools/review_proposal_identity.py same "$proposal" "$RUNNER_TEMP/closed-catalogue-proposal.json"
              same_status=$?
              set -e
              if [[ "$same_status" == 0 ]]; then
                echo "Matching review was previously closed; do not reopen unchanged identities." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              elif [[ "$same_status" != 1 ]]; then
                echo "::error::Invalid historical proposal; refuse to republish."
                exit 1
              fi
              branch="${base_branch}-${fingerprint}"
            fi
          fi

          if [[ "$create_pr" == true ]]; then
            # Unique content-addressed branches also retain their closed-PR
            # history. Orphaned branches from failed gh pr create are recovered.
            existing_reviews="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
              --state all --limit 100 --json number --jq 'length')"
            if [[ "$existing_reviews" != "0" ]]; then
              echo "This proposal revision already had a review PR; no duplicate created." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --quiet origin "$branch"
            git switch -c "$branch" "origin/$branch"
          else
            if [[ "$create_pr" != true ]]; then
              echo "::error::Open review PR points to a missing origin branch."
              exit 1
            fi
            git switch -c "$branch"
          fi

          mkdir -p reports
          cp "$proposal" reports/catalogue-import-proposal.json
          git add reports/catalogue-import-proposal.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public identity review proposal [skip ci]"
            git push origin "HEAD:$branch"
          else
            echo "Existing review branch is already current." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$create_pr" != true ]]; then
            echo "Updated existing review PR rather than opening another." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > "$RUNNER_TEMP/catalogue-pr-body.md" <<MARKDOWN
          ### What

          This draft stages **${count} public identity proposals** backed by 3.20/AnyPS5 source metadata. No canonical records are changed.

          ### Tested

          - Public names rehashed against the verified NID algorithm
          - Source revisions and catalogue manifest consistency checked
          - Unsafe names and conflicting source identities withheld
          - Publication identity fingerprint: \`${fingerprint}\`
          - Firmware scope, ABI, registration and runtime behaviour **not certified**

          ### Review required

          Independently verify provenance, licensing, owner, firmware scope and signature evidence. This metadata-only PR must not be auto-merged.
          MARKDOWN
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --draft \
            --title "data: review ${count} publicly sourced catalogue identities" \
            --body-file "$RUNNER_TEMP/catalogue-pr-body.md"
          echo "Opened draft catalogue review PR on $branch." >> "$GITHUB_STEP_SUMMARY"
